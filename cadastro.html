<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow | Cadastro</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">S</div>
          <span>StockFlow</span>
        </div>

        <nav>
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="produtos.html">Produtos</a>
          <a class="nav-link active" href="cadastro.html">Cadastrar</a>
          <a class="nav-link" href="movimentacao.html">Movimentação</a>
          <button id="logoutButton" class="btn btn-secondary" type="button">Sair</button>
        </nav>
      </aside>

      <main class="content">
        <div class="topbar">
          <h2 id="tituloFormulario">Cadastrar produto</h2>
          <div class="user-pill">
            <div class="circle">U</div>
            <span id="usuarioLogado">Usuário</span>
          </div>
        </div>

        <div class="form-card">
          <form id="produtoForm">
            <input type="hidden" name="idProduto" />

            <div class="form-grid">
              <div class="form-group">
                <label for="nome">Nome</label>
                <input id="nome" name="nome" type="text" placeholder="Ex.: Café torrado" required />
              </div>

              <div class="form-group">
                <label for="codigoProduto">Código</label>
                <input id="codigoProduto" name="codigo" type="text" readonly required />
              </div>

              <div class="form-group">
                <label for="valor_unitario">Valor unitário</label>
                <input id="valor_unitario" name="valor_unitario" type="number" min="0.01" step="0.01" placeholder="0.00" required />
              </div>

              <div class="form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" required>
                  <option value="">Selecione</option>
                  <option value="Bebidas">Bebidas</option>
                  <option value="Limpeza">Limpeza</option>
                  <option value="Higiene">Higiene</option>
                  <option value="Alimentos">Alimentos</option>
                  <option value="Eletrônicos">Eletrônicos</option>
                  <option value="Papelaria">Papelaria</option>
                  <option value="Açougue">Açougue</option>
                  <option value="Padaria">Padaria</option>
                  <option value="Outros">Outros</option>
                </select>
              </div>

              <div class="form-group">
                <label for="quantidade">Quantidade inicial</label>
                <input id="quantidade" name="quantidade" type="number" min="0" step="1" placeholder="0" required />
              </div>

              <div class="form-group">
                <label for="estoque_minimo">Estoque mínimo</label>
                <input id="estoque_minimo" name="estoque_minimo" type="number" min="0" step="1" placeholder="0" required />
              </div>
            </div>

            <div class="form-footer">
              <a class="btn btn-secondary" href="produtos.html">Voltar</a>
              <button id="btnSalvarProduto" type="submit" class="btn btn-primary">Salvar produto</button>
            </div>

            <div id="cadastroMessage" class="message" aria-live="polite"></div>
          </form>
        </div>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
