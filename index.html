<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow | Login</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="login-body">
    <div class="login-shell">
      <section class="login-illustration">
        <div class="login-brand">
          <div class="brand-icon">S</div>
          <span>StockFlow</span>
        </div>

        <div class="login-highlight">Seja bem-vindo!</div>

      </section>

      <section class="login-panel">
        <div class="eyebrow">Entre para acompanhar os produtos e movimentações do seu estoque.</div>

        <form id="loginForm" class="form-box" novalidate>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="seu@email.com" required />
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" placeholder="Sua senha" required />
          </div>

          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <div id="loginMessage" class="message" aria-live="polite"></div>
      </section>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
