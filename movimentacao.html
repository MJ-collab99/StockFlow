<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow | Movimentação</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">S</div>
          <span>StockFlow</span>
        </div>

        <nav>
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="produtos.html">Produtos</a>
          <a class="nav-link" href="cadastro.html">Cadastrar</a>
          <a class="nav-link active" href="movimentacao.html">Movimentação</a>
          <button id="logoutButton" class="btn btn-secondary" type="button">Sair</button>
        </nav>
      </aside>

      <main class="content">
        <div class="topbar">
          <h2>Movimentação</h2>
          <div class="user-pill">
            <div class="circle">U</div>
            <span id="usuarioLogado">Usuário</span>
          </div>
        </div>

        <div class="form-card">
          <form id="movimentacaoForm">
            <div class="form-grid">
              <div class="form-group">
                <label for="produtoId">Produto</label>
                <select id="produtoId" name="produtoId" required>
                  <option value="">Carregando...</option>
                </select>
              </div>

              <div class="form-group">
                <label for="tipo">Tipo de movimentação</label>
                <select id="tipo" name="tipo" required>
                  <option value="">Selecione</option>
                  <option value="entrada">Entrada</option>
                  <option value="saida">Saída</option>
                </select>
              </div>

              <div class="form-group full">
                <label for="quantidade">Quantidade</label>
                <input id="quantidade" name="quantidade" type="number" min="1" step="1" placeholder="Ex.: 10" required />
              </div>
            </div>

            <div class="form-footer">
              <button type="submit" class="btn btn-primary">Registrar movimentação</button>
            </div>

            <div id="movimentacaoMessage" class="message" aria-live="polite"></div>
          </form>
        </div>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
