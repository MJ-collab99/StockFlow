<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockFlow | Produtos</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-icon">S</div>
          <span>StockFlow</span>
        </div>

        <nav>
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link active" href="produtos.html">Produtos</a>
          <a class="nav-link" href="cadastro.html">Cadastrar</a>
          <a class="nav-link" href="movimentacao.html">Movimentação</a>
          <button id="logoutButton" class="btn btn-secondary" type="button">Sair</button>
        </nav>
      </aside>

      <main class="content">
        <div class="topbar">
          <h2>Produtos</h2>
          <div class="user-pill">
            <div class="circle">U</div>
            <span id="usuarioLogado">Usuário</span>
          </div>
        </div>

        <div class="page-actions">
          <div class="search-box form-group">
            <input id="pesquisaProduto" type="text" placeholder="Pesquisar produto por nome ou código" />
          </div>
          <a href="cadastro.html" class="btn btn-primary">Novo produto</a>
        </div>

        <div class="table-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Código</th>
                  <th>Valor</th>
                  <th>Categoria</th>
                  <th>Disponível</th>
                  <th>Mínimo</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="produtosTableBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
